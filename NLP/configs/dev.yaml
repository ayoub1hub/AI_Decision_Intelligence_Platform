# NLP dev config
environment: dev

preprocessing:
  language: english
  remove_stopwords: true
  lemmatize: true
  min_token_length: 2

paths:
  input_dir: "data/raw"
  output_dir: "data/processed"
  log_file: "logs/nlp.log"

logging:
  level: "INFO"
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"