# Production configuration
environment: prod

data:
  raw_dir: "/var/data/raw"
  processed_dir: "/var/data/processed"
  input_file: "arxiv_full.csv"
  output_file: "arxiv_clean.parquet"
  dtypes:
    id: "string"
    authors: "string"
    categories: "string"
  parse_dates:
    - published_date
    - updated_date

schema:
  path: "configs/schemas/arxiv_v1.yaml"

logging:
  level: "WARNING"          # moins de bruit en prod
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  datefmt: "%Y-%m-%d %H:%M:%S"
  log_file: "/var/log/data_engine/pipeline.log"